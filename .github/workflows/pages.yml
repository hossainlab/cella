# Build the serverless (static) Cella site and publish it to GitHub Pages.
#
# 1. `cella export` writes every fixed API response plus compact expression
#    tables from the tracked artifacts in data/processed/.
# 2. Next.js builds a static export that reads those files and runs free-text
#    queries (reverse lookup, gene/signature) in the browser.
# The FastAPI backend is not deployed here; it stays available for server mode.
name: Deploy static site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.11"

      - name: Export static data
        run: |
          uv sync --group api
          uv run --group api cella export --out web/public/data

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json

      - id: pages
        uses: actions/configure-pages@v5

      - name: Build static site
        working-directory: web
        env:
          NEXT_PUBLIC_DATA_MODE: static
          # "/<repo>" for a project site; empty when served from a custom domain.
          NEXT_PUBLIC_BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: |
          npm ci
          npx next build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
