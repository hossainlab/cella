[project]
name = "cella"
version = "0.1.0"
description = "Knowledge and decision-support platform over the CellTypist Organ Atlases (working codename; app name TBD)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Md. Jubayer Hossain" }]

# Always-installed, lightweight shared deps (config, CLI, logging).
# Heavy science + web-server deps live in dependency-groups below so the
# base environment stays fast to resolve.
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "typer>=0.12",
    "structlog>=24.1",
    "jupyter>=1.1.1",
    "lab>=8.10",
]

[project.scripts]
# Offline data-pipeline CLI: `uv run cella <command>`
cella = "cella.pipeline.__main__:app"

[dependency-groups]
# Offline data pipeline (heavy). Install with: uv sync --group pipeline
pipeline = [
    "scanpy>=1.10",
    "anndata>=0.10",
    "celltypist>=1.6",
    "cellhint>=1.0",
    "numpy>=1.26",
    "scipy>=1.13",
    "pandas>=2.2",
    "scikit-learn>=1.4",
    "pyarrow>=16.0",
    "httpx>=0.27",
    "tqdm>=4.66",
    # Remote HDF5 .obs reads (only the metadata bytes, not the full atlas).
    "fsspec>=2024.5",
    "aiohttp>=3.9",
    "cellxgene-ontology-guide>=1.11.1",
    "decoupler>=2.2.0",
    "liana>=1.8.0",
    "gseapy>=1.3.0",
    "lxml>=6.1.1",
]

# Online FastAPI backend. Install with: uv sync --group api
api = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "alembic>=1.13",
    "pyarrow>=16.0",
    "pandas>=2.2",
    "plotly>=6.9.0",
]

# Offline analyses over the extracted weights (scripts/invariance_*.py).
# Lighter than `pipeline`: unpickles the CellTypist models directly, so it needs
# scikit-learn for the estimator classes but not scanpy/anndata.
analysis = [
    "numpy>=1.26",
    "pandas>=2.2",
    "pyarrow>=16.0",
    "scipy>=1.13",
    # <1.7 keeps LogisticRegression(multi_class=...), which celltypist.train
    # passes; stability replicates must use the published training code path.
    "scikit-learn>=1.4,<1.7",
    "matplotlib>=3.8",
    "cellxgene-ontology-guide>=1.11.1",
]

# Dev tooling (installed by default).
dev = [
    "pytest>=8.2",
    "ruff>=0.5",
    "mypy>=1.10",
]

[tool.uv]
default-groups = ["dev"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cella"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# B008: Typer uses function calls (typer.Option/Argument) in argument defaults by design.
ignore = ["B008"]

[tool.mypy]
python_version = "3.11"
packages = ["cella"]
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
